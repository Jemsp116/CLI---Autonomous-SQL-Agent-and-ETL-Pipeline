[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "CLI-first invoice extraction and analysis toolkit"
requires-python = ">=3.10"
dependencies = [
  "camelot-py[cv]>=0.11",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.3",
  "pandas>=2.0",
  "pdfplumber>=0.11",
  "pydantic-settings>=2.0",
  "reportlab>=4.0",
  "sqlalchemy>=2.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
invoice-agent = "invoice_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "llm: tests that require an external LLM or API key",
]
